                      participa: true
                mesma_idempotency_key_devolve_a_mesma_resposta_sem_creditar_:
                  summary: 'Mesma Idempotency-Key: devolve a mesma resposta sem creditar de novo'
                  value:
                    coinsAwarded: 30
                    balance: 30
                    balance_formatado: '30'
                    message: 'Garrafa PET 500ml: +30 coins.'
                    produto:
                      codigo: '7896004004778'
                      nome: Garrafa PET 500ml
                      marca: Marca Exemplo
                      imagem: https://images.openfoodfacts.org/exemplo.jpg
                      icone: 🧴
                      categoria: plastico
                      categoria_rotulo: Plástico
                      coins: 30
                      participa: true
