  /scans:
    post:
      tags:
      - Master (admin)
      summary: Leitura de teste (só master)
      description: "Mantida para testes e para a apresentação: credita na conta do próprio master. No fluxo real\
        \ quem lê os produtos é o Ecoponto (`POST /ecopontos/{id}/leituras`). Repetir a mesma Idempotency-Key devolve\
        \ a mesma resposta (cabeçalho `Idempotency-Replayed: true`) sem creditar de novo.\n\n**Login:** master.\
        \  \n**Limite:** leituras: 30 por minuto por conta (429 ao passar)."
      operationId: post_scans
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyObrigatoria'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                scannedAt:
                  type: string
                  format: date-time
            examples:
              leitura_de_teste_pelo_master:
                summary: Leitura de teste pelo master
                value:
                  code: '7896004004778'
                  scannedAt: '2026-11-16T14:32:00Z'
              mesma_idempotency_key_devolve_a_mesma_resposta_sem_creditar_:
                summary: 'Mesma Idempotency-Key: devolve a mesma resposta sem creditar de novo'
                value:
                  code: '7896004004778'
                  scannedAt: '2026-11-16T14:32:00Z'
      responses:
        '200':
          description: 'OK: Leitura de teste pelo master / Mesma Idempotency-Key: devolve a mesma resposta sem creditar
            de novo'
          content:
            application/json:
              schema:
                type: object
                properties:
                  coinsAwarded:
