  /admin/pessoas/{pessoa}:
    delete:
      tags:
      - Master (admin)
      summary: Excluir pessoa (anonimiza)
      description: |-
        Anonimiza os dados pessoais e revoga os tokens; o histórico continua. Não exclui usuários master (403); repetir dá 409.

        **Login:** master.
      operationId: delete_admin_pessoas_pessoa
      parameters:
      - name: pessoa
        in: path
        required: true
        description: Id da pessoa.
        schema:
          type: string
        example: '3'
      responses:
        '200':
          description: 'OK: Excluir (anonimizar) pessoa'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                excluir_anonimizar_pessoa:
                  summary: Excluir (anonimizar) pessoa
                  value:
                    message: Pessoa excluída (dados pessoais anonimizados).
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: 'Sem permissão: Não exclui o master'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                nao_exclui_o_master:
                  summary: Não exclui o master
                  value:
                    erro: sem_permissao
                    message: Não é possível excluir um usuário master.
      security:
      - bearerAuth: []
