  /empresas/me/leituras:
    get:
      tags:
      - Empresa
      summary: Histórico de leituras dos Ecopontos (CSV)
      description: |-
        Leituras de código de barras feitas nos Ecopontos da empresa, do mais recente para o mais antigo. Inclui as recusadas (`resultado_rotulo`: Creditado, Duplicado, Fora da campanha, Código inválido); nessas, `coins` é 0 e `kg_formatado` é "—". O front junta as páginas e gera o CSV "Histórico de leituras".

        **LGPD:** nenhum dado de quem reciclou (sem pessoa, nome, CPF, e-mail nem sessão).

        **Login:** empresa (só os próprios Ecopontos; Ecoponto de outra empresa = 403).
      operationId: get_empresas_me_leituras
      parameters:
      - name: periodo
        in: query
        required: false
        description: mes = desde o dia 1º deste mês (padrão); 3m e 6m = últimos 3 e 6 meses; tudo = sem limite. O servidor
          calcula as datas.
        schema:
          type: string
          enum:
          - mes
          - 3m
          - 6m
          - tudo
          default: mes
        example: mes
      - name: ecoponto_id
        in: query
        required: false
        description: Só as leituras deste Ecoponto (da própria empresa).
        schema:
          type: integer
        example: 3
      - name: pagina
        in: query
        required: false
        description: Página (começa em 1).
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: por_pagina
        in: query
        required: false
        description: Itens por página (máximo 100).
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      responses:
        '200':
          description: 'OK: Histórico de leituras'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        data:
                          type: string
                          format: date-time
                        data_formatada:
                          type: string
                        ecoponto_id:
                          type: integer
                        ecoponto_codigo:
                          type: string
                        ecoponto_nome:
                          type: string
                        codigo_barras:
                          type: string
                        produto:
                          type: string
                        categoria:
                          type: string
                        kg:
                          type: number
                        kg_formatado:
                          type: string
                        coins:
                          type: integer
                        resultado:
                          type: string
                        resultado_rotulo:
                          type: string
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      pagina:
                        type: integer
                      por_pagina:
                        type: integer
                      ultima_pagina:
                        type: integer
                      periodo:
                        type: string
                      periodo_rotulo:
                        type: string
                      desde:
                        type: string
                        format: date-time
                  links:
                    type: object
                    properties:
                      primeira:
                        type: string
                      anterior:
                        type: string
                        nullable: true
                      proxima:
                        type: string
                        nullable: true
                      ultima:
                        type: string
              examples:
                leituras_do_mes:
                  summary: Leituras deste mês
                  value:
                    data:
                    - id: 3
                      data: '2026-11-22T03:48:03Z'
                      data_formatada: 22/11/2026 às 00:48
                      ecoponto_id: 1
                      ecoponto_codigo: ECO-01
                      ecoponto_nome: Centro Recicla Mangaratiba
                      codigo_barras: '7891234567895'
