  /auth/2fa:
    post:
      tags:
      - Autenticação
      summary: 'Login (2ª etapa): resposta da pergunta'
      description: |-
        Compara no servidor: nome da mãe sem acento e sem diferença de maiúsculas; data dd/mm/aaaa (ou aaaa-mm-dd); CEP só com os dígitos. Até 3 tentativas em 5 minutos; na 3ª errada o desafio é bloqueado (423, mensagem do enunciado). Desafio vencido: 410. Toda tentativa entra no log de autenticação.

        **Limite:** verificação: 10 a cada 15 minutos por IP + desafio (429 ao passar).
      operationId: post_auth_2fa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                desafio_id:
                  type: string
                resposta:
                  type: string
                lembrar:
                  type: boolean
            examples:
              resposta_errada:
                summary: Resposta errada
                value:
                  desafio_id: 52fda33e-e82c-41bb-83eb-eb1134ba4688
                  resposta: resposta errada
              resposta_certa_devolve_o_token:
                summary: 'Resposta certa: devolve o token'
                value:
                  desafio_id: 52fda33e-e82c-41bb-83eb-eb1134ba4688
                  resposta: maria jose da silva
                  lembrar: false
              3_resposta_errada_desafio_bloqueado:
                summary: '3ª resposta errada: desafio bloqueado'
                value:
                  desafio_id: ab87207b-d432-4bef-835f-0bc2b25bb167
                  resposta: errada 3
              desafio_ja_bloqueado_ou_vencido:
                summary: Desafio já bloqueado ou vencido
                value:
                  desafio_id: ab87207b-d432-4bef-835f-0bc2b25bb167
                  resposta: qualquer
      responses:
        '200':
          description: 'OK: Resposta certa: devolve o token'
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  token_tipo:
                    type: string
                  expira_em:
                    type: string
                    format: date-time
                  usuario:
                    type: object
                    properties:
                      id:
                        type: integer
                      nome:
                        type: string
                      email:
                        type: string
                      login:
                        type: string
                      tipo:
                        type: string
                      perfil:
                        type: string
                      avatar:
                        type: string
                        nullable: true
                      coins:
                        type: integer
                      coins_formatado:
                        type: string
                  message:
                    type: string
              examples:
                resposta_certa_devolve_o_token:
                  summary: 'Resposta certa: devolve o token'
                  value:
                    token: 1|hnDIudwz2CrLMWfcsDTQXgcEF1vo1x6LRxm3A2UZ353c4bac
                    token_tipo: Bearer
                    expira_em: '2026-11-16T12:59:49Z'
                    usuario:
                      id: 2
                      nome: Ana Maria da Silva
                      email: ana.silva@exemplo.com
                      login: anamar
                      tipo: pessoa
                      perfil: comum
                      avatar: null
                      coins: 0
                      coins_formatado: '0'
                    message: Login realizado.
        '422':
          description: 'Dados inválidos: Resposta errada'
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                  message:
                    type: string
                  tentativas_restantes:
                    type: integer
              examples:
                resposta_errada:
                  summary: Resposta errada
                  value:
                    erro: resposta_invalida
                    message: Resposta incorreta. Você tem mais 2 tentativas.
                    tentativas_restantes: 2
        '423':
          description: 'Bloqueado: 3ª resposta errada: desafio bloqueado / Desafio já bloqueado ou vencido'
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                  message:
                    type: string
                  tentativas_restantes:
                    type: integer
              examples:
                3_resposta_errada_desafio_bloqueado:
                  summary: '3ª resposta errada: desafio bloqueado'
                  value:
                    erro: desafio_bloqueado
                    message: 3 tentativas sem sucesso! Favor realizar Login novamente.
                    tentativas_restantes: 0
                desafio_ja_bloqueado_ou_vencido:
                  summary: Desafio já bloqueado ou vencido
                  value:
                    erro: desafio_bloqueado
                    message: 3 tentativas sem sucesso! Favor realizar Login novamente.
                    tentativas_restantes: 0
        '429':
          $ref: '#/components/responses/MuitasTentativas'
