  /pessoas:
    post:
      tags:
      - Públicas
      summary: Cadastro de pessoa
      description: |-
        Regras: nome de 15 a 80 caracteres; CPF com dígitos verificadores; login de exatamente 6 letras; senha forte: 8+ caracteres com maiúscula, minúscula e número (`SENHA_REGRA=forte`, o padrão; `SENHA_REGRA=enunciado` = exatamente 8 letras); celular com DDD (11 dígitos) e fixo com DDD (10 dígitos, opcional); CEP de 8 dígitos; UF de 2 letras; `termos_aceitos` = true. CPF, CEP e telefones podem vir com ou sem máscara. Não devolve token: a pessoa entra pelo login (com 2FA).

        **Limite:** cadastro: 60 por hora por IP (429 ao passar).
      operationId: post_pessoas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                email:
                  type: string
                cpf:
                  type: string
                login:
                  type: string
                senha:
                  type: string
                nome_mae:
                  type: string
                nascimento:
                  type: string
                sexo:
                  type: string
                telefone_celular:
                  type: string
                telefone_fixo:
                  type: string
                cep:
                  type: string
                logradouro:
                  type: string
                numero:
                  type: string
                bairro:
                  type: string
                cidade:
                  type: string
                uf:
                  type: string
                termos_aceitos:
                  type: boolean
            examples:
              cadastro_de_pessoa:
                summary: Cadastro de pessoa
                value:
                  nome: Ana Maria da Silva
                  email: ana.silva@exemplo.com
                  cpf: '12345678909'
                  login: anamar
                  senha: Reciclar1
                  nome_mae: Maria José da Silva
                  nascimento: '1990-05-12'
                  sexo: feminino
                  telefone_celular: '21999991234'
                  telefone_fixo: '2133331234'
                  cep: '20040020'
                  logradouro: Rua da Assembleia
                  numero: '10'
                  bairro: Centro
                  cidade: Rio de Janeiro
                  uf: RJ
                  termos_aceitos: true
              e_mail_cpf_ou_login_repetido:
                summary: E-mail, CPF ou login repetido
                value:
                  nome: Ana Maria da Silva
                  email: ana.silva@exemplo.com
                  cpf: '12345678909'
                  login: anamar
                  senha: Reciclar1
                  nome_mae: Maria José da Silva
                  nascimento: '1990-05-12'
                  sexo: feminino
                  telefone_celular: '21999991234'
                  telefone_fixo: '2133331234'
                  cep: '20040020'
                  logradouro: Rua da Assembleia
                  numero: '10'
                  bairro: Centro
                  cidade: Rio de Janeiro
                  uf: RJ
                  termos_aceitos: true
              dados_invalidos:
                summary: Dados inválidos
                value:
                  nome: Ana
                  email: ana
                  cpf: '11111111111'
                  login: ana1
                  senha: '123'
      responses:
        '201':
          description: 'Criado: Cadastro de pessoa'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  usuario:
                    type: object
                    properties:
                      id:
                        type: integer
                      nome:
                        type: string
                      email:
                        type: string
                      login:
                        type: string
                      tipo:
                        type: string
                      perfil:
                        type: string
              examples:
                cadastro_de_pessoa:
                  summary: Cadastro de pessoa
                  value:
                    message: Cadastro realizado! Faça login para entrar.
                    usuario:
                      id: 2
                      nome: Ana Maria da Silva
                      email: ana.silva@exemplo.com
                      login: anamar
                      tipo: pessoa
                      perfil: comum
        '409':
          description: 'Conflito: E-mail, CPF ou login repetido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                e_mail_cpf_ou_login_repetido:
                  summary: E-mail, CPF ou login repetido
                  value:
                    erro: duplicado
                    message: Este e-mail já está cadastrado.
                    campos:
                      email:
                      - Este e-mail já está cadastrado.
                      cpf:
                      - Este CPF já está cadastrado.
                      login:
                      - Este login já está em uso. Escolha outro.
        '422':
          description: 'Dados inválidos: Dados inválidos'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                dados_invalidos:
                  summary: Dados inválidos
                  value:
                    erro: validacao
                    message: O nome deve ter entre 15 e 80 caracteres.
                    campos:
                      nome:
                      - O nome deve ter entre 15 e 80 caracteres.
                      email:
                      - Informe um e-mail válido.
                      cpf:
                      - CPF inválido.
                      login:
                      - O login deve ter exatamente 6 letras.
