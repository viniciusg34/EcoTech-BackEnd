        - `totais`: cartões do topo (Ecopontos, kg, leituras validadas, ativos e a variação de kg do mês: "↑ 12% vs mês anterior").
        - `serie`: últimos 6 meses, do mais antigo ao mais recente, com rótulos curtos ("Jun"), `valores`, `valores_formatados` e `total_formatado`.
        - `categorias`: kg por material com `percentual` **inteiro**; os percentuais somam 100.
        - `ecopontos`: `endereco`, `categorias`, `kg_mes_formatado` (kg do mês corrente) e `ultima_atividade` em texto ("Hoje, 08h30", "Ontem, 16h40", "Há 2 dias" ou a data). A data exata fica em `ultima_atividade_iso`.

        `resumo` e `serie_mensal` continuam vindo (formato anterior).

        **Login:** empresa.
      operationId: get_empresas_me_dashboard
      responses:
        '200':
          description: 'OK: Painel da empresa'
          content:
            application/json:
              schema:
                type: object
                properties:
                  empresa:
                    type: object
                    properties:
                      id:
                        type: integer
                      nome:
                        type: string
