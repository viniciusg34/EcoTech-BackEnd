components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: 'Token devolvido no login. Ex.: `Authorization: Bearer 12|abc...`'
  parameters:
    IdempotencyKeyObrigatoria:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID novo por ação. Repetir a mesma chave devolve a mesma resposta sem gravar de novo.
      schema:
        type: string
        format: uuid
    IdempotencyKeyOpcional:
      name: Idempotency-Key
      in: header
      required: false
      description: Opcional. UUID novo por ação; protege contra leitura repetida por falha de rede.
      schema:
        type: string
        format: uuid
  schemas:
    Erro:
      type: object
      required:
      - erro
      - message
      properties:
        erro:
          type: string
          description: 'Código curto e estável do erro (ex.: validacao, saldo_insuficiente).'
        message:
          type: string
          description: Texto pronto para mostrar no toast.
        campos:
          type: object
          description: 'Só em erros de validação: campo -> lista de mensagens.'
          additionalProperties:
            type: array
            items:
              type: string
    Meta:
      type: object
      properties:
        total:
          type: integer
        pagina:
          type: integer
        por_pagina:
          type: integer
        ultima_pagina:
          type: integer
  responses:
    NaoAutenticado:
      description: Token ausente, vencido ou revogado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: nao_autenticado
            message: Sua sessão expirou ou você não está logado. Faça login de novo.
    SemPermissao:
      description: O token não tem o papel exigido pela rota.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: sem_permissao
            message: Acesso permitido apenas para o administrador (master).
    NaoEncontrado:
      description: Registro inexistente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: nao_encontrado
            message: Não encontrado.
    Validacao:
      description: Dados inválidos; `campos` diz o que corrigir.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: validacao
            message: O nome deve ter entre 15 e 80 caracteres.
            campos:
              nome:
              - O nome deve ter entre 15 e 80 caracteres.
              email:
              - Informe um e-mail válido.
              cpf:
              - CPF inválido.
              login:
              - O login deve ter exatamente 6 letras.
              senha:
              - A senha precisa ter 8 ou mais caracteres, com letra maiúscula, minúscula e número.
              nome_mae:
              - O campo nome da mãe é obrigatório.
              nascimento:
              - O campo data de nascimento é obrigatório.
              sexo:
              - O campo sexo é obrigatório.
              telefone_celular:
              - O campo telefone celular é obrigatório.
              cep:
              - O campo CEP é obrigatório.
              logradouro:
              - O campo logradouro é obrigatório.
              numero:
              - O campo número é obrigatório.
              bairro:
              - O campo bairro é obrigatório.
              cidade:
              - O campo cidade é obrigatório.
              uf:
              - O campo UF é obrigatório.
              termos_aceitos:
              - Você precisa aceitar os Termos e Condições.
    MuitasTentativas:
      description: Limite de pedidos atingido; veja o cabeçalho Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: muitas_tentativas
            message: Muitas tentativas. Tente de novo em 15 minutos.
      headers:
        Retry-After:
          description: Segundos até poder tentar de novo.
          schema:
            type: integer
