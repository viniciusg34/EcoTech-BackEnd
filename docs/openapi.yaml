                  nome: Ecoponto Praia de Muriqui
                  descricao: Coleta de plástico e metal
                  endereco: Av. Beira Mar, 100
                  cidade: Mangaratiba
                  estado: RJ
                  lat: -22.9205
                  lng: -43.9442
                  categorias:
                  - plastico
                  - metal
      responses:
        '201':
          description: 'Criado: Criar Ecoponto (código automático)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  codigo:
                    type: string
                  nome:
                    type: string
                  descricao:
                    type: string
                  endereco:
                    type: string
                  cidade:
                    type: string
                  estado:
                    type: string
                  lat:
                    type: number
                  lng:
                    type: number
                  status:
                    type: string
                  status_rotulo:
                    type: string
                  status_cor:
                    type: string
                  categorias:
                    type: array
                    items:
                      type: object
                      properties:
                        chave:
                          type: string
                        rotulo:
                          type: string
                        cor_hex:
                          type: string
                        icone:
                          type: string
                        unidade:
                          type: string
                        coins_por_unidade:
                          type: integer
                        coins_rotulo:
                          type: string
                  kg_coletado:
                    type: integer
                  kg_coletado_formatado:
                    type: string
                  empresa:
                    type: object
                    properties:
                      id:
                        type: integer
                      nome:
                        type: string
                  message:
                    type: string
              examples:
                criar_ecoponto_codigo_automatico:
                  summary: Criar Ecoponto (código automático)
