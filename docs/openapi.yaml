  /auth/login:
    post:
      tags:
      - Autenticação
      summary: Login (1ª etapa)
      description: |-
        Envie `email` **ou** `login` e a `senha` (`lembrar` = true deixa o token valer 30 dias em vez de 8 horas). Pessoa (comum ou master) recebe a pergunta de segurança (`status: "2fa"`); empresa recebe o token direto.

        **Limite:** login: 5 tentativas a cada 15 minutos por IP + conta (429 ao passar).
      operationId: post_auth_login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                senha:
                  type: string
                lembrar:
                  type: boolean
                email:
                  type: string
            examples:
              pessoa_senha_certa_pede_a_pergunta_2fa:
                summary: 'Pessoa: senha certa, pede a pergunta (2FA)'
                value:
                  login: anamar
                  senha: Reciclar1
                  lembrar: false
              empresa_entra_direto_sem_2fa:
                summary: 'Empresa: entra direto (sem 2FA)'
                value:
                  email: contato@costaverde.ecotech.example
                  senha: Ecotech2026
              senha_errada:
                summary: Senha errada
                value:
                  login: anamar
                  senha: errada
              muitas_tentativas_5_a_cada_15_min:
                summary: Muitas tentativas (5 a cada 15 min)
                value:
                  login: anamar
                  senha: outra
      responses:
        '200':
          description: 'OK: Pessoa: senha certa, pede a pergunta (2FA) / Empresa: entra direto (sem 2FA)'
