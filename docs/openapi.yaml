                    produto:
                      codigo: '7896004004778'
                      nome: Garrafa PET 500ml
                      marca: Marca Exemplo
                      imagem: https://images.openfoodfacts.org/exemplo.jpg
                      icone: 🧴
                      categoria: plastico
                      categoria_rotulo: Plástico
