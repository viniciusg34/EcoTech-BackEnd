# EcoTech API v1 — gerado a partir das rotas e de respostas reais dos testes.
# Abra em https://editor.swagger.io (File > Import file) ou no Insomnia/Postman.
openapi: 3.0.3
info:
  title: EcoTech API
  version: 1.0.0
  description: |-
    API REST do **EcoTech**: pessoas ganham EcoCoins ao reciclar nos Ecopontos das empresas parceiras e trocam as moedas por recompensas.

    **Endereço base:** `{BASE_URL}` = `https://SEU-DOMINIO/api/v1` (local: `http://127.0.0.1:8000/api/v1`).

    **Autenticação:** token Bearer do Laravel Sanctum no cabeçalho `Authorization: Bearer {token}`. O token vem de `POST /auth/2fa` (pessoa e master) ou de `POST /auth/login` (empresa). Vale 8 horas, ou 30 dias com `lembrar: true`. Sem cookies.

    **Papéis:** `pessoa` (comum ou master), `master` (pessoa com perfil master: rotas `/admin/*` e `/scans`) e `empresa` (rotas `/empresas/me/*` e as de gestão dos próprios Ecopontos).

    **Erros:** sempre JSON `{ "erro": "codigo_curto", "message": "texto pronto", "campos": { ... } }`, inclusive 401, 403, 404, 405, 422, 429 e 500.

    **Listas:** `{ "data": [...], "meta": { "total", "pagina", "por_pagina", "ultima_pagina" }, "links": { ... } }` com `?pagina=N&por_pagina=M` (máximo 100).

    **Idempotency-Key:** em `POST /resgates` e `POST /scans` (obrigatória) e em `POST /ecopontos/{id}/leituras` e `POST /coletas` (opcional), envie um UUID novo por ação. Repetir a mesma chave devolve a mesma resposta sem gravar de novo (cabeçalho `Idempotency-Replayed: true`).

    **Respostas prontas:** datas em ISO 8601 (UTC, terminando em Z) e em texto pt-BR (`data_formatada`: "10/11/2026 às 14:32", horário de Brasília); números com `*_formatado` ("1.250"); CPF mascarado; rótulos, cores e ícones de categorias e status; `message` pronta para os toasts. O front não precisa calcular nem formatar nada.

    Os exemplos deste arquivo são respostas reais da API, gravadas pelos testes automáticos com dados fictícios.
servers:
- url: http://127.0.0.1:8000/api/v1
  description: Local (php artisan serve)
- url: https://{dominio}/api/v1
  description: Produção (HTTPS obrigatório)
  variables:
    dominio:
      default: api.seudominio.com.br
tags:
- name: Públicas
  description: 'Sem login: mapa, catálogo, cadastro e números da página inicial.'
- name: Autenticação
  description: Login em duas etapas (senha + pergunta de segurança), Google e recuperação de senha.
- name: Pessoa
  description: Rotas da pessoa logada (perfil, saldo, extrato, resgates).
- name: Ecoponto (sessão e leituras)
  description: 'Fluxo no Ecoponto: a pessoa lê o QR da placa, o Ecoponto (empresa) lê os produtos e as moedas vão
    para a pessoa.'
- name: Empresa
  description: 'Área da empresa parceira: dados, painel e gestão dos próprios Ecopontos.'
- name: Master (admin)
  description: 'Área do master: consulta e exclusão de pessoas, log de autenticação, catálogo, recompensas e empresas.'
paths:
  /saude:
    get:
      tags:
      - Públicas
      summary: Saúde da API (o front escolhe o ambiente)
      description: |-
        O front consulta esta rota para saber se o ambiente (local ou servidor) está no ar e qual usar. Testa o banco de verdade: com o MySQL fora do ar responde 503 e o front troca de ambiente. `modo` é sempre `real` (o valor `demo` é só do servidor de demonstração do front).

        Sem token e **fora** do limite de requisições.
      operationId: get_saude
      responses:
        '200':
          description: API e banco no ar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  banco:
                    type: string
                  modo:
                    type: string
                  versao:
                    type: string
              example:
                status: ok
                banco: ok
                modo: real
                versao: 1.0.0
        '503':
          description: Banco de dados fora do ar
          content:
            application/json:
              schema:
                type: object
              example:
                status: erro
                banco: erro
                modo: real
                message: Banco de dados indisponível.
      security: []
  /estatisticas:
    get:
      tags:
      - Públicas
      summary: Números públicos da página inicial e do Sobre nós
      description: Total reciclado (kg e toneladas), pessoas ativas, Ecopontos e empresas parceiras. Guardado em
        cache por 5 minutos.
      operationId: get_estatisticas
      responses:
        '200':
          description: 'OK: Números do topo da página inicial'
          content:
            application/json:
              schema:
                type: object
                properties:
                  toneladas:
                    type: integer
                  toneladas_formatado:
                    type: string
                  kg:
                    type: number
                  kg_formatado:
                    type: string
                  membros:
                    type: integer
                  membros_formatado:
                    type: string
                  ecopontos:
                    type: integer
                  empresas:
                    type: integer
              examples:
                numeros_do_topo_da_pagina_inicial:
                  summary: Números do topo da página inicial
                  value:
                    toneladas: 0
                    toneladas_formatado: 0,0
                    kg: 3.02
                    kg_formatado: 3,02 kg
                    membros: 1
                    membros_formatado: '1'
                    ecopontos: 23
                    empresas: 3
  /config:
    get:
      tags:
      - Públicas
      summary: Configurações públicas
      description: Moedas e kg do check-in, espera entre check-ins (horas), janela de duplicidade das leituras (horas)
        e duração da sessão no Ecoponto (minutos). Vêm da tabela `configuracao`.
      operationId: get_config
      responses:
        '200':
          description: 'OK: Configurações públicas'
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkin_coins:
                    type: integer
                  checkin_cooldown_horas:
                    type: integer
                  checkin_kg:
                    type: number
                  duplicidade_horas:
                    type: integer
                  sessao_minutos:
                    type: integer
              examples:
                configuracoes_publicas:
                  summary: Configurações públicas
                  value:
                    checkin_coins: 50
                    checkin_cooldown_horas: 6
                    checkin_kg: 0.5
                    duplicidade_horas: 24
                    sessao_minutos: 10
  /categorias:
    get:
      tags:
      - Públicas
      summary: Categorias de material
      description: Rótulo, cor, ícone, unidade e moedas por unidade de cada material.
      operationId: get_categorias
      responses:
        '200':
          description: 'OK: Categorias de material'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        chave:
                          type: string
                        rotulo:
                          type: string
                        cor_hex:
                          type: string
                        icone:
                          type: string
                        unidade:
                          type: string
                        coins_por_unidade:
                          type: integer
                        coins_rotulo:
                          type: string
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      pagina:
                        type: integer
                      por_pagina:
                        type: integer
                      ultima_pagina:
                        type: integer
                  links:
                    type: object
                    properties:
                      primeira:
                        type: string
                      anterior:
                        type: string
                        nullable: true
                      proxima:
                        type: string
                        nullable: true
                      ultima:
                        type: string
              examples:
                categorias_de_material:
                  summary: Categorias de material
                  value:
                    data:
                    - chave: metal
                      rotulo: Metal
                      cor_hex: '#f9a825'
                      icone: 🥫
                      unidade: kg
                      coins_por_unidade: 20
                      coins_rotulo: 20 coins por kg
                    - chave: papel
                      rotulo: Papel
                      cor_hex: '#66bb6a'
                      icone: 📦
                      unidade: kg
                      coins_por_unidade: 8
                      coins_rotulo: 8 coins por kg
                    - chave: vidro
                      rotulo: Vidro
                      cor_hex: '#42a5f5'
                      icone: 🫙
                      unidade: kg
                      coins_por_unidade: 6
                      coins_rotulo: 6 coins por kg
                    meta:
                      total: 6
                      pagina: 1
                      por_pagina: 100
                      ultima_pagina: 1
                    links:
                      primeira: http://localhost:8000/api/v1/categorias?pagina=1
                      anterior: null
                      proxima: null
                      ultima: http://localhost:8000/api/v1/categorias?pagina=1
  /recompensas:
    get:
      tags:
      - Públicas
      summary: Recompensas ativas
      description: Lista paginada das recompensas ativas. `cat` ausente ou `todos` traz todas.
      operationId: get_recompensas
      parameters:
      - name: cat
        in: query
        required: false
        description: 'Categoria: food, transport, health, shop, leisure ou todos.'
        schema:
          type: string
          enum:
          - todos
          - food
          - transport
          - health
          - shop
          - leisure
        example: food
      - name: pagina
        in: query
        required: false
        description: Página (começa em 1).
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: por_pagina
        in: query
        required: false
        description: Itens por página (máximo 100).
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: 'OK: Recompensas de uma categoria'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        categoria:
                          type: string
                        categoria_rotulo:
                          type: string
                        icone:
                          type: string
                        nome:
                          type: string
                        descricao:
                          type: string
                        custo_coins:
                          type: integer
                        custo_formatado:
                          type: string
                        estoque:
                          type: string
                          nullable: true
                        disponivel:
                          type: boolean
                        ativa:
                          type: boolean
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      pagina:
                        type: integer
                      por_pagina:
                        type: integer
                      ultima_pagina:
                        type: integer
                  links:
                    type: object
                    properties:
                      primeira:
                        type: string
                      anterior:
                        type: string
                        nullable: true
                      proxima:
                        type: string
                        nullable: true
                      ultima:
                        type: string
              examples:
                recompensas_de_uma_categoria:
                  summary: Recompensas de uma categoria
                  value:
                    data:
                    - id: 2
                      categoria: food
                      categoria_rotulo: Alimentação
                      icone: ☕
                      nome: Café Grátis
                      descricao: Starbucks ou cafeteria parceira
                      custo_coins: 80
                      custo_formatado: '80'
                      estoque: null
                      disponivel: true
                      ativa: true
                    - id: 3
                      categoria: food
                      categoria_rotulo: Alimentação
                      icone: 🥤
                      nome: Eco Garrafa
                      descricao: Garrafa reutilizável em cafeteria parceira
                      custo_coins: 120
                      custo_formatado: '120'
                      estoque: null
                      disponivel: true
                      ativa: true
                    - id: 1
                      categoria: food
                      categoria_rotulo: Alimentação
                      icone: 🍔
                      nome: Cupom McDonald's
                      descricao: 20% OFF em combos
                      custo_coins: 200
                      custo_formatado: '200'
                      estoque: null
                      disponivel: true
                      ativa: true
                    meta:
                      total: 3
                      pagina: 1
                      por_pagina: 50
                      ultima_pagina: 1
                    links:
                      primeira: http://localhost:8000/api/v1/recompensas?cat=food&pagina=1
                      anterior: null
                      proxima: null
                      ultima: http://localhost:8000/api/v1/recompensas?cat=food&pagina=1
  /ecopontos:
    get:
      tags:
      - Públicas
      summary: Ecopontos do mapa
      description: Lista paginada. O front pede `por_pagina=100` e junta as páginas até `meta.total`. Nunca devolve
        o segredo do QR.
      operationId: get_ecopontos
      parameters:
      - name: empresa
        in: query
        required: false
        description: Só os Ecopontos desta empresa (id).
        schema:
          type: integer
      - name: categoria
        in: query
        required: false
        description: 'Só os Ecopontos que aceitam este material (chave da categoria, ex.: metal).'
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: 'Filtra pelo status: ativo, manutencao ou inativo.'
        schema:
          type: string
          enum:
          - ativo
          - manutencao
          - inativo
      - name: busca
        in: query
        required: false
        description: Texto para buscar (no servidor).
        schema:
          type: string
      - name: pagina
        in: query
        required: false
        description: Página (começa em 1).
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: por_pagina
        in: query
        required: false
        description: Itens por página (máximo 100).
        schema:
          type: integer
          minimum: 1
          maximum: 100
        example: 2
      responses:
        '200':
          description: 'OK: Ecopontos do mapa (paginado)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        codigo:
                          type: string
                        nome:
                          type: string
                        descricao:
                          type: string
                        endereco:
                          type: string
                        cidade:
                          type: string
                        estado:
                          type: string
                        lat:
                          type: number
                        lng:
                          type: number
                        status:
                          type: string
                        status_rotulo:
                          type: string
                        status_cor:
                          type: string
                        categorias:
                          type: array
                          items:
                            type: object
                            properties:
                              chave:
                                type: string
                              rotulo:
                                type: string
                              cor_hex:
                                type: string
                              icone:
                                type: string
                              unidade:
                                type: string
                              coins_por_unidade:
                                type: integer
                              coins_rotulo:
                                type: string
                        kg_coletado:
                          type: integer
                        kg_coletado_formatado:
                          type: string
                        empresa:
                          type: object
                          properties:
                            id:
                              type: integer
                            nome:
                              type: string
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      pagina:
                        type: integer
                      por_pagina:
                        type: integer
                      ultima_pagina:
                        type: integer
                  links:
                    type: object
                    properties:
                      primeira:
                        type: string
                      anterior:
                        type: string
                        nullable: true
                      proxima:
                        type: string
                      ultima:
                        type: string
              examples:
                ecopontos_do_mapa_paginado:
                  summary: Ecopontos do mapa (paginado)
                  value:
                    data:
                    - id: 1
                      codigo: ECO-01
                      nome: Centro Recicla Mangaratiba
                      descricao: Papelão, caixotes e restos de madeira
                      endereco: Centro
                      cidade: Mangaratiba
                      estado: RJ
                      lat: -22.9597
                      lng: -44.0406
                      status: ativo
                      status_rotulo: Ativo
                      status_cor: '#2e7d32'
                      categorias:
                      - chave: papel
                        rotulo: Papel
                        cor_hex: '#66bb6a'
                        icone: 📦
                        unidade: kg
                        coins_por_unidade: 8
                        coins_rotulo: 8 coins por kg
                      - chave: madeira
                        rotulo: Madeira
                        cor_hex: '#8d6e63'
                        icone: 🪵
                        unidade: kg
                        coins_por_unidade: 5
                        coins_rotulo: 5 coins por kg
                      kg_coletado: 0
                      kg_coletado_formatado: 0 kg
                      empresa:
                        id: 1
                        nome: Recicla Costa Verde
                    - id: 2
                      codigo: ECO-02
                      nome: EcoPonto Vila Muriqui
                      descricao: Latinhas, ferragens e embalagens plásticas
                      endereco: Vila Muriqui
                      cidade: Mangaratiba
                      estado: RJ
                      lat: -22.9245
                      lng: -43.9538
                      status: ativo
                      status_rotulo: Ativo
                      status_cor: '#2e7d32'
                      categorias:
                      - chave: metal
                        rotulo: Metal
                        cor_hex: '#f9a825'
                        icone: 🥫
                        unidade: kg
                        coins_por_unidade: 20
                        coins_rotulo: 20 coins por kg
                      - chave: plastico
                        rotulo: Plástico
                        cor_hex: '#ef5350'
                        icone: 🧴
                        unidade: kg
                        coins_por_unidade: 12
                        coins_rotulo: 12 coins por kg
                      kg_coletado: 0
                      kg_coletado_formatado: 0 kg
                      empresa:
                        id: 1
                        nome: Recicla Costa Verde
                    meta:
                      total: 22
                      pagina: 1
                      por_pagina: 2
                      ultima_pagina: 11
                    links:
                      primeira: http://localhost:8000/api/v1/ecopontos?por_pagina=2&pagina=1
                      anterior: null
                      proxima: http://localhost:8000/api/v1/ecopontos?por_pagina=2&pagina=2
                      ultima: http://localhost:8000/api/v1/ecopontos?por_pagina=2&pagina=11
    post:
      tags:
      - Empresa
      summary: Criar Ecoponto
      description: |-
        `codigo` é opcional (o servidor gera o próximo ECO-NN). `categorias` = chaves dos materiais aceitos.

        **Login:** empresa.
      operationId: post_ecopontos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                descricao:
                  type: string
                endereco:
                  type: string
                cidade:
                  type: string
                estado:
                  type: string
                lat:
                  type: number
                lng:
                  type: number
                categorias:
                  type: array
                  items:
                    type: string
            examples:
              criar_ecoponto_codigo_automatico:
                summary: Criar Ecoponto (código automático)
