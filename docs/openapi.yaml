  /admin/pessoas:
    get:
      tags:
      - Master (admin)
      summary: Consulta de pessoas
      description: |-
        Só usuários **comuns** (o master não aparece), em ordem alfabética. Busca por parte do **nome**. LGPD: CPF mascarado; nunca devolve nome da mãe, nascimento ou CEP.

        **Login:** master.
      operationId: get_admin_pessoas
      parameters:
      - name: busca
        in: query
        required: false
        description: Parte do nome (busca no servidor).
        schema:
          type: string
        example: silva
      - name: perfil
        in: query
        required: false
        description: 'comum (padrão). master ou todos: uso interno, o front não precisa.'
        schema:
          type: string
          enum:
          - comum
          - master
      - name: incluir_removidas
        in: query
        required: false
        description: 1 = inclui as pessoas anonimizadas.
        schema:
          type: boolean
      - name: pagina
        in: query
        required: false
        description: Página (começa em 1).
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: por_pagina
        in: query
        required: false
        description: Itens por página (máximo 100).
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: 'OK: Consulta de pessoas (busca por nome)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        nome:
                          type: string
                        email:
                          type: string
                        login:
                          type: string
                        perfil:
                          type: string
                        cpf_mascarado:
                          type: string
                        cidade:
                          type: string
                        uf:
                          type: string
                        coins:
                          type: integer
                        coins_formatado:
                          type: string
                        ativo:
                          type: boolean
                        anonimizada:
                          type: boolean
                        criado_em:
                          type: string
                          format: date-time
                        criado_em_formatado:
                          type: string
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      pagina:
                        type: integer
                      por_pagina:
                        type: integer
                      ultima_pagina:
                        type: integer
                  links:
                    type: object
                    properties:
                      primeira:
                        type: string
                      anterior:
                        type: string
                        nullable: true
                      proxima:
                        type: string
                        nullable: true
                      ultima:
                        type: string
              examples:
                consulta_de_pessoas_busca_por_nome:
                  summary: Consulta de pessoas (busca por nome)
                  value:
                    data:
                    - id: 2
                      nome: Ana Maria da Silva Souza
                      email: ana.silva@exemplo.com
                      login: anamar
                      perfil: comum
                      cpf_mascarado: '***.456.789-**'
                      cidade: Rio de Janeiro
                      uf: RJ
                      coins: 20
                      coins_formatado: '20'
                      ativo: true
                      anonimizada: false
                      criado_em: '2026-11-16T04:59:49Z'
                      criado_em_formatado: 16/11/2026
                    meta:
                      total: 1
                      pagina: 1
                      por_pagina: 20
                      ultima_pagina: 1
                    links:
                      primeira: http://localhost:8000/api/v1/admin/pessoas?busca=silva&pagina=1
                      anterior: null
                      proxima: null
                      ultima: http://localhost:8000/api/v1/admin/pessoas?busca=silva&pagina=1
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: 'Sem permissão: Pessoa comum tentando área do master'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                pessoa_comum_tentando_area_do_master:
                  summary: Pessoa comum tentando área do master
                  value:
                    erro: sem_permissao
                    message: Acesso permitido apenas para o administrador (master).
      security:
      - bearerAuth: []
