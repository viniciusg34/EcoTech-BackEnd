                    estado: RJ
                    lat: -22.9205
                    lng: -43.9442
                    status: ativo
                    status_rotulo: Ativo
                    status_cor: '#2e7d32'
                    categorias:
                    - chave: metal
                      rotulo: Metal
                      cor_hex: '#f9a825'
                      icone: 🥫
                      unidade: kg
                      coins_por_unidade: 20
                      coins_rotulo: 20 coins por kg
                    - chave: plastico
                      rotulo: Plástico
                      cor_hex: '#ef5350'
                      icone: 🧴
                      unidade: kg
                      coins_por_unidade: 12
                      coins_rotulo: 12 coins por kg
                    kg_coletado: 0
                    kg_coletado_formatado: 0 kg
                    empresa:
                      id: 1
                      nome: Recicla Costa Verde
                    message: Ecoponto criado.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
