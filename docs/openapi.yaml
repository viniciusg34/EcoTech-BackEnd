        '422':
          $ref: '#/components/responses/Validacao'
      security:
      - bearerAuth: []
  /ecopontos/{ecoponto}:
    get:
      tags:
      - Públicas
      summary: Um Ecoponto
      description: Aceita o id (`3`) ou o código (`ECO-01`).
      operationId: get_ecopontos_ecoponto
      parameters:
      - name: ecoponto
        in: path
        required: true
        description: 'Id ou código do Ecoponto (ex.: 1 ou ECO-01).'
        schema:
          type: string
        example: ECO-01
      responses:
        '200':
          description: 'OK: Um Ecoponto (pelo id ou pelo código)'
          content:
            application/json:
              schema:
                type: object
